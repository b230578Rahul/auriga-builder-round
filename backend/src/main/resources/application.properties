spring.application.name=parking-garage

# ---------- H2 in-memory DB ----------
spring.datasource.url=jdbc:h2:mem:garagedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ---------- App / JWT ----------
server.port=8080
app.jwt.secret=ThisIsA256BitSecretKeyForJwtSigningUseOnlyInDevEnvironment123456
app.jwt.expiration-ms=86400000

# Rate rules (kept configurable, used by FeeCalculationService)
app.parking.base-fee=5.0
app.parking.hourly-rate=3.0
app.parking.daily-cap=25.0

# CORS - Angular dev server
app.cors.allowed-origin=http://localhost:4200
